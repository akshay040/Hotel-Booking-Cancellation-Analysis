[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hotel-cancellation"
version = "1.0.0"
description = "Reproducible hotel booking cancellation risk modelling"
requires-python = ">=3.10"
dependencies = [
  "joblib==1.4.2",
  "numpy==1.26.4",
  "pandas==2.2.2",
  "scikit-learn==1.5.1",
]

[project.optional-dependencies]
app = ["streamlit==1.37.1"]
dev = ["pytest==8.3.2", "ruff==0.5.7"]

[project.scripts]
hotel-train = "hotel_cancellation.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
